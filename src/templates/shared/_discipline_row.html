<tr class="border-b border-gray-200 hover:bg-teal-50 transition-colors duration-200 cursor-pointer"
    hx-get="/disciplines/{{ discipline.id }}?editable=True"
    hx-trigger="click"
    hx-target="this"
    hx-swap="outerHTML">
    <td class="py-3 px-4 text-left whitespace-nowrap w-full">
        <span class="font-medium">{{ discipline.name }}</span>
    </td>
</tr>
